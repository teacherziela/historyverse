<!doctype html><html lang="ms"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#291d42;--purple:#6941a5;--pale:#f4effb;--line:#dfd6ed}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f6f3fb;font:16px/1.65 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px max(5%,20px);display:flex;justify-content:space-between;align-items:center;gap:15px}small,.muted{color:#756786}header strong{display:block;letter-spacing:1px}main{max-width:850px;margin:32px auto;padding:0 20px}.card{padding:30px;background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 36px #3f215509;margin:18px 0}h1{font-size:clamp(27px,5vw,39px);line-height:1.2;margin:14px 0}h2{font-size:24px}.tag{font-size:12px;letter-spacing:2px;color:var(--purple);font-weight:800}label{display:block;font-weight:650;margin-top:16px}input,textarea,select{font:inherit;width:100%;padding:13px;border:1px solid #bca9cf;border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:155px;resize:vertical;line-height:1.7}button{font:inherit;font-weight:650;cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:12px 20px;border-radius:12px;min-height:48px}button:hover{border-color:var(--purple)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--purple);color:white;border-color:var(--purple)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.notice{padding:12px 16px;border-radius:12px;background:#eee6fa}.error{color:#8e281f;background:#fff0e9;padding:12px;border-radius:10px;white-space:pre-wrap}.question{white-space:pre-wrap;font-size:18px;line-height:1.8}.option{display:flex;width:100%;text-align:left;gap:16px;margin:10px 0;align-items:center;font-weight:450}.option b{border-radius:8px;background:var(--pale);padding:4px 11px}.selected{border:2px solid var(--purple);background:#f5effe}.steps{display:flex;gap:8px;margin:20px 0}.steps span{flex:1;padding:10px;border-radius:10px;background:#e9e3f0;text-align:center;font-size:14px}.steps .active{background:var(--purple);color:white}.timer{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}#message:empty{display:none}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}progress{width:100%;accent-color:var(--purple);height:8px}.part{margin:24px 0;padding-top:16px;border-top:1px solid var(--line)}.pill{font-size:13px;border-radius:20px;background:var(--pale);padding:5px 12px;display:inline-block}footer{text-align:center;font-size:13px;color:#766887;padding:20px}a{color:var(--purple)}@media(max-width:520px){main{padding:0 12px;margin:18px auto}.card{padding:20px}header{padding:12px 16px}header small{font-size:11px}.nav button{padding:10px 12px}}
</style></head><body><header><div><strong>HISTORYVERSE <span style="color:#9c73c8">360</span></strong><small>Ruang Peperiksaan • Cikgu Zamzila</small></div><div class="timer" id="timer">—</div></header><main><div id="message" role="alert"></div><div id="app"><div class="card">Menyemak jadual peperiksaan…</div></div><p id="saveState" role="status" aria-live="polite"></p></main><footer>Jawab dengan jujur. Usaha sendiri mencerminkan penguasaan anda.</footer><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rpc=(a,p={})=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).examRpc(a,p));
let token='',attempt=null,state=null,questions=[],index=0,dirty={},choiceDirty=false,busy=false,debounce,clockBase=0,clockAt=0,lastPhase='',loading=false,localWarning='';
try{token=localStorage.getItem('hv-exam-token')||'';}catch{}
function err(e){$('message').className='error';$('message').textContent=e.message||String(e);}
function clearErr(){$('message').textContent='';}
function setState(s){state=s;clockBase=s.serverTime;clockAt=performance.now();}
function localSave(){try{localStorage.setItem('hv-exam-draft',JSON.stringify({token,id:attempt?.id,dirty,choice:attempt?.choice,choiceDirty,version:attempt?.version}));}catch{$('saveState').textContent='Storan peranti tidak tersedia. Pastikan jawapan disimpan ke guru sebelum menutup halaman.';}}
function timeText(t){return new Date(t).toLocaleString('ms-MY',{timeZone:'Asia/Kuala_Lumpur',dateStyle:'medium',timeStyle:'short'});}
function render(){
 if(!state)return;
 if(attempt?.submitted||state.phase==='done'){$('app').innerHTML='<div class="card"><span class="tag">PEPERIKSAAN TAMAT</span><h1>'+ (attempt?.submitted?'Jawapan diterima':'Masa menjawab telah tamat')+'</h1><p>'+ (attempt?'Jawapan yang berjaya disimpan tersedia untuk guru.':'Hubungi guru jika memerlukan bantuan.')+'</p>'+(attempt?'<p>Nama: <b>'+esc(attempt.name)+'</b><br>Kelas: '+esc(attempt.className)+'<br>No. rujukan: '+esc(attempt.id)+'</p>':'')+'<p>Markah akan disemak oleh guru. Jawapan betul tidak dipaparkan di sini.</p>'+(attempt&&!attempt.submitted?'<button class="primary" id="finish">Sahkan penghantaran</button>':'')+'</div>';if($('finish'))$('finish').onclick=finish;return;}
 if(!attempt){$('app').innerHTML='<div class="card"><span class="tag">UASA 2026 · TINGKATAN 1</span><h1>Ruang Peperiksaan<br>Sejarah</h1><p class="muted">Satu soalan setiap paparan. Masa serentak untuk semua murid.</p><div class="steps"><span>A · 15 minit</span><span>B · 40 minit</span><span>C · 30 minit</span></div><p class="notice">'+(state.start?'Mula: '+esc(timeText(state.start)):'Jadual belum ditetapkan oleh guru.')+'</p>'+(state.phase==='closed'?'<p>Peperiksaan belum dibuka. Sila tunggu arahan guru.</p>':'<form id="join"><label>Nama penuh<input id="name" autocomplete="name" required maxlength="100"></label><label>Kelas<input id="className" placeholder="Contoh: 1 Amanah" required maxlength="40"></label><label>Kod peperiksaan<input id="code" required maxlength="60" autocomplete="off"></label><p><button class="primary" type="submit">Masuk peperiksaan →</button></p></form>')+'<p class="muted">Gunakan satu tab dan peranti yang sama sehingga selesai.</p></div>';if($('join'))$('join').onsubmit=join;return;}
 if(state.phase==='waiting'){$('app').innerHTML='<div class="card"><span class="tag">RUANG MENUNGGU</span><h1>Selamat datang, '+esc(attempt.name)+'</h1><p>Kelas '+esc(attempt.className)+'</p><p class="notice">Soalan dibuka serentak pada '+esc(timeText(state.start))+'.</p><p>Pastikan internet stabil. Anda boleh menyemak jawapan dalam bahagian yang masih dibuka.</p></div>';return;}
 if(!['A','B','C'].includes(state.phase)){ $('app').innerHTML='<div class="card">Peperiksaan ditutup oleh guru.</div>';return;}
 const ph=state.phase,qs=ph==='C'?questions.filter(q=>String(q.number)===String(attempt.choice)):questions,nums=[...new Set(qs.map(q=>q.number))];index=Math.min(index,Math.max(0,nums.length-1));const n=nums[index],parts=qs.filter(q=>q.number===n);
 let h='<div class="row"><div><span class="tag">'+esc(attempt.name)+'</span><div>'+esc(attempt.className)+'</div></div><span class="pill">Bahagian '+ph+'</span></div><div class="steps">'+['A','B','C'].map(s=>'<span class="'+(s===ph?'active':'')+'">Bahagian '+s+'</span>').join('')+'</div>';
 if(ph==='C')h+='<div class="card"><h2>Pilih satu soalan esei</h2><div class="row">'+[5,6].map(v=>'<button class="'+(String(attempt.choice)===String(v)?'selected':'')+'" data-choice="'+v+'">Soalan '+v+'<br><small>'+(v===5?'Pengertian & kepentingan sejarah':'Perluasan kuasa Tamadun India')+'</small></button>').join('')+'</div><p class="muted">Hanya soalan yang dipilih akan ditanda. Anda boleh menukar pilihan sebelum penghantaran.</p></div>';
 if(parts.length){h+='<div class="card"><span class="tag">SOALAN '+n+(ph!=='C'?' · '+(index+1)+' DARIPADA '+nums.length:'')+'</span><progress value="'+(index+1)+'" max="'+nums.length+'"></progress><p class="question">'+esc(parts[0].intro)+'</p>';
 parts.forEach(q=>{h+='<div class="part"><p class="question">'+(ph==='A'?'':esc(q.id.slice(-1))+') ')+esc(q.text)+'</p>';if(ph==='A')h+=q.options.map((v,i)=>'<button class="option '+(attempt.answers[q.id]===String.fromCharCode(65+i)?'selected':'')+'" data-id="'+q.id+'" data-value="'+String.fromCharCode(65+i)+'"><b>'+String.fromCharCode(65+i)+'</b><span>'+esc(v)+'</span></button>').join('');else h+='<label for="'+q.id+'">Jawapan ('+q.max+' markah)</label><textarea id="'+q.id+'" maxlength="2000" data-answer="'+q.id+'" spellcheck="false">'+esc(attempt.answers[q.id]||'')+'</textarea>';h+='</div>';});
 h+='<div class="nav"><button id="prev" '+(index===0?'disabled':'')+'>← Sebelumnya</button><button id="next" class="primary" '+(index===nums.length-1?'disabled':'')+'>Seterusnya →</button></div></div>';}
 h+='<div class="row"><button id="saveNow">Simpan sekarang</button>'+(ph==='C'?'<button class="primary" id="finish">Hantar peperiksaan</button>':'')+'</div><p class="muted">Bahagian akan bertukar mengikut jadual. Simpan jawapan sebelum masa bahagian tamat.</p>';
 $('app').innerHTML=h;document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{edit(el.dataset.id,el.dataset.value);render();});document.querySelectorAll('[data-answer]').forEach(el=>el.oninput=()=>edit(el.dataset.answer,el.value));document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=async()=>{if(!await save())return;attempt.choice=el.dataset.choice;choiceDirty=true;localSave();render();await save();});
 if($('prev'))$('prev').onclick=async()=>{if(await save()){index--;render();window.scrollTo(0,0);}};if($('next'))$('next').onclick=async()=>{if(await save()){index++;render();window.scrollTo(0,0);}};$('saveNow').onclick=save;if($('finish'))$('finish').onclick=finish;
}
function edit(id,value){attempt.answers[id]=value;dirty[id]=value;localSave();$('saveState').textContent='Belum disimpan ke guru…';clearTimeout(debounce);debounce=setTimeout(save,1400);}
async function save(){
 clearTimeout(debounce);if(busy)return false;if(!Object.keys(dirty).length&&!choiceDirty)return true;if(!attempt)return false;
 busy=true;const sent={...dirty},chosen=attempt.choice,wasChoice=choiceDirty;try{const r=await rpc('save',{token,version:attempt.version,answers:sent,...(wasChoice?{choice:chosen}:{})});setState(r.state);if(r.attempt.submitted){attempt=r.attempt;dirty={};choiceDirty=false;localSave();render();throw Error('Percubaan sudah dihantar. Perubahan selepas penghantaran tidak diterima.');}attempt.version=r.attempt.version;attempt.submitted=r.attempt.submitted;Object.keys(sent).forEach(k=>{if(dirty[k]===sent[k])delete dirty[k];});if(attempt.choice===chosen)choiceDirty=false;localSave();$('saveState').textContent=Object.keys(dirty).length?'Perubahan baharu menunggu simpanan…':'✓ Jawapan disimpan ke guru';clearErr();return !Object.keys(dirty).length&&!choiceDirty;}catch(e){err(e);$('saveState').textContent='Belum diterima guru. Cuba Simpan sekarang sebelum masa tamat.';return false;}finally{busy=false;if(Object.keys(dirty).length&&state&&['A','B','C'].includes(state.phase))debounce=setTimeout(save,10000);}
}
async function join(e){e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{if(!token)token=crypto.randomUUID()+crypto.randomUUID();try{localStorage.setItem('hv-exam-token',token);}catch{}const r=await rpc('join',{token,name:$('name').value,className:$('className').value,code:$('code').value});attempt=r.attempt;setState(r.state);clearErr();await refresh();render();}catch(e){err(e);btn.disabled=false;}}
async function finish(){if(!confirm('Hantar semua jawapan? Selepas dihantar, jawapan tidak boleh diubah.'))return;if(!await save())return;try{const r=await rpc('submit',{token});attempt=r.attempt;setState(r.state);clearErr();render();}catch(e){err(e);}}
async function refresh(){if(loading||busy)return;loading=true;try{if(!attempt&&token){try{const r=await rpc('load',{token});attempt=r.attempt;setState(r.state);questions=r.questions;let d;try{d=JSON.parse(localStorage.getItem('hv-exam-draft'));}catch{}if(d&&d.token===token&&d.id===attempt.id&&d.version===attempt.version){dirty=d.dirty||{};choiceDirty=!!d.choiceDirty;if(choiceDirty)attempt.choice=d.choice;Object.assign(attempt.answers,dirty);if(Object.keys(dirty).length)err('Jawapan belum dihantar ditemui pada peranti ini. Tekan Simpan sekarang sebelum masa tamat.');}}catch{setState(await rpc('status'));}}
 else if(attempt){const r=await rpc('load',{token});const changed=state?.phase!==r.state.phase;setState(r.state);if(changed){if(Object.keys(dirty).length||choiceDirty){err('Ada jawapan yang tidak sempat disimpan sebelum bahagian tamat. Hubungi guru; jawapan simpanan terakhir digunakan.');localWarning=JSON.stringify(dirty);dirty={};choiceDirty=false;}attempt=r.attempt;questions=r.questions;index=0;render();}else if(r.attempt.submitted){attempt=r.attempt;render();}}
 else setState(await rpc('status'));if(lastPhase!==state.phase||!$('app').dataset.ready){lastPhase=state.phase;render();$('app').dataset.ready='1';}clearTimeout(window.retryTimer);
 }catch(e){err(e);}finally{loading=false;}}
function tick(){if(!state)return;const now=clockBase+performance.now()-clockAt,sec=Math.max(0,Math.ceil((state.phaseEnd-now)/1000));$('timer').textContent=['A','B','C','waiting'].includes(state.phase)?Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'):'Sesi tamat';if(sec===0&&['A','B','C','waiting'].includes(state.phase))refresh();}
window.addEventListener('beforeunload',e=>{if(Object.keys(dirty).length||busy){e.preventDefault();e.returnValue='';}});window.addEventListener('online',()=>save());setInterval(refresh,20000);setInterval(tick,1000);refresh();
</script></body></html>
