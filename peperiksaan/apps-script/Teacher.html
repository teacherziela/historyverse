<!doctype html><html lang="ms"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{font:15px/1.6 system-ui;color:#302041;background:#f6f2fc;margin:0;padding:24px}h1,h2{margin:6px 0 16px}button,input,select,textarea{font:inherit;border:1px solid #cbbbdb;border-radius:8px;padding:10px}button{background:#6941a5;color:white;cursor:pointer}button:disabled{opacity:.5}input,textarea{width:100%;background:white}textarea{min-height:95px}label{display:block;margin:12px 0}.card{background:white;border:1px solid #e2d7ee;border-radius:14px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#766485}.answer{white-space:pre-wrap;background:#f4f0fa;padding:16px;border-radius:9px}.question{white-space:pre-wrap}.mark{max-width:110px}#message{white-space:pre-wrap;color:#873d22}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #e4dcea;padding:10px}input[type=checkbox]{width:auto}small{display:block}a{color:#6941a5}</style></head><body><h1>HISTORYVERSE · Panel guru</h1><p class="muted">Soalan dan jawapan disimpan dalam Google Sheets persendirian ini.</p><div class="row"><button id="settingsTab">Tetapan peperiksaan</button><button id="marksTab">Tanda jawapan</button><button id="reload">Muat semula</button><button id="csv">Muat turun keputusan CSV</button></div><p id="message" role="status"></p><main id="app">Memuatkan…</main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,tab='settings',selected='';
const rpc=(a,p={})=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).teacherRpc(a,p));
async function run(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();}catch(e){$('message').textContent=e.message||String(e);}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
async function load(){data=await rpc('load');render();}
function render(){if(tab==='settings')settings();else marks();}
function settings(){const c=data.config;const start=c.mula?new Date(Date.parse(c.mula)+8*3600000).toISOString().slice(0,16):'';
 $('app').innerHTML='<section class="card"><h2>1. Import kertas soalan</h2><p>Fail JSON soalan disediakan berasingan. Fail ini tidak disimpan dalam repositori awam.</p><input id="importFile" type="file" accept=".json"><p>'+data.questions.length+' pecahan soalan dimasukkan. '+data.students.length+' murid berdaftar.</p><p class="muted">Import dikunci selepas murid mula mendaftar.</p></section><section class="card"><h2>2. Skema objektif rasmi</h2><p>Masukkan jawapan betul A–D. Setiap soalan bernilai 1 markah.</p><div class="grid">'+Array.from({length:20},(_,i)=>'<label>'+(i+1)+'<select id="key'+i+'"><option value="">Pilih</option>'+['A','B','C','D'].map(v=>'<option '+(data.questions.find(q=>q.id==='A'+(i+1))?.key===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'</div></section><section class="card"><h2>3. Jadual & pengesahan</h2><label>Mula (waktu Malaysia)<input id="start" type="datetime-local" value="'+esc(start)+'"></label><p>A: 15 minit · B: 40 minit · C: 30 minit. Masa dikawal oleh pelayan, bukan jam peranti murid.</p><label>Kod masuk murid<input id="code" maxlength="60" value="'+esc(c.kod_masuk)+'" placeholder="Sekurang-kurangnya 6 aksara"></label><label>Markah Soalan 6(a)<select id="c6"><option value="6">6 — asal; jumlah esei 22 (belum boleh diaktifkan)</option><option value="4" '+(data.questions.find(q=>q.id==='C6a')?.max===4?'selected':'')+'>4 — diselaraskan; jumlah esei 20</option></select></label><label><input type="checkbox" id="reviewed" '+(c.kertas_disemak==='YA'?'checked':'')+'> Saya telah menyemak semua soalan, rajah/petikan dan skema.</label><label><input type="checkbox" id="active" '+(c.aktif==='YA'?'checked':'')+'> Buka pendaftaran dan aktifkan jadual serentak</label><button id="saveConfig">Simpan tetapan</button><p class="muted">Tetapan dikunci selepas pendaftaran pertama. Gunakan salinan helaian dan projek baharu bagi peperiksaan lain.</p></section><section class="card"><h2>Semak kandungan kertas</h2>'+data.questions.map(q=>'<details><summary>'+esc(q.id)+' · '+q.max+' markah</summary><p class="question">'+esc(q.intro)+'\n'+esc(q.text)+'</p>'+q.options.map((o,i)=>'<p>'+String.fromCharCode(65+i)+'. '+esc(o)+'</p>').join('')+'</details>').join('')+'</section>';
 $('importFile').onchange=e=>run(async()=>{const f=e.target.files[0];if(!f)return;const json=JSON.parse(await f.text());await rpc('import',{questions:json.questions||json});$('message').textContent='Soalan berjaya diimport. Semak kandungan di bawah.';await load();});
 $('saveConfig').onclick=()=>run(async()=>{if(!$('start').value)throw Error('Pilih tarikh dan waktu mula.');await rpc('configure',{key:Array.from({length:20},(_,i)=>$('key'+i).value),start:$('start').value+':00+08:00',code:$('code').value,c6:Number($('c6').value),reviewed:$('reviewed').checked,active:$('active').checked});$('message').textContent='Tetapan disimpan.';await load();});
}
function marks(){const s=data.students.find(s=>s.id===selected);$('app').innerHTML='<section class="card"><h2>Jawapan murid</h2><label>Cari nama / kelas<input id="search" placeholder="Taip nama atau kelas"></label><div id="list"></div></section><div id="review"></div>';
 const list=()=>{const query=$('search').value.toLowerCase();$('list').innerHTML='<table><thead><tr><th>Murid</th><th>Objektif</th><th>Status</th><th></th></tr></thead><tbody>'+data.students.filter(s=>(s.name+' '+s.className).toLowerCase().includes(query)).map(s=>'<tr><td>'+esc(s.name)+'<small>'+esc(s.className)+'</small></td><td>'+s.auto+'/20</td><td>'+(s.complete?'Selesai':s.submitted?'Dihantar':'Simpanan automatik')+'</td><td><button data-student="'+esc(s.id)+'">Tanda</button></td></tr>').join('')+'</tbody></table>';document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{selected=b.dataset.student;marks();});};$('search').oninput=list;list();
 if(!s)return;const qs=data.questions.filter(q=>q.section==='B'||q.section==='C'&&String(q.number)===String(s.choice));
 $('review').innerHTML='<section class="card"><h2>'+esc(s.name)+'</h2><p>'+esc(s.className)+' · Esei '+esc(s.choice||'belum dipilih')+' · Objektif <b>'+s.auto+'/20</b></p><details><summary>Semak jawapan objektif</summary>'+data.questions.filter(q=>q.section==='A').map(q=>'<p>'+q.id+': '+esc(s.answers[q.id]||'Kosong')+' · Skema '+esc(q.key)+'</p>').join('')+'</details><p class="muted">Penandaan disimpan selepas peperiksaan tamat. Ruang kosong bermaksud belum ditanda; 0 ialah markah sifar.</p>'+qs.map(q=>'<div class="card"><b>'+q.id+' · '+q.max+' markah</b><p class="question">'+esc(q.intro)+'\n'+esc(q.text)+'</p><div class="answer">'+esc(s.answers[q.id]||'(Tiada jawapan)')+'</div><label>Markah guru<input class="mark" data-mark="'+q.id+'" type="number" min="0" max="'+q.max+'" step="1" value="'+esc(s.marks[q.id]??'')+'"></label></div>').join('')+'<label>Catatan guru<textarea id="feedback">'+esc(s.feedback)+'</textarea></label><button id="saveMarks">Simpan markah murid ini</button></section>';
 $('saveMarks').onclick=()=>run(async()=>{const grades={};document.querySelectorAll('[data-mark]').forEach(e=>grades[e.dataset.mark]=e.value);await rpc('mark',{id:s.id,marks:grades,feedback:$('feedback').value});$('message').textContent='Markah disimpan dalam tab Markah.';await load();});
}
function csv(){const cell=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Nama','Kelas','Objektif /20','Jumlah /80','Status'],...data.students.map(s=>[s.name,s.className,s.auto,s.total,s.complete?'Selesai':'Belum lengkap'])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='keputusan-uasa.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
 $('settingsTab').onclick=()=>{tab='settings';render();};$('marksTab').onclick=()=>{tab='marks';render();};$('reload').onclick=()=>run(load);$('csv').onclick=csv;run(load);
</script></body></html>
